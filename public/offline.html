<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1F6B4A">
<title>Liinky · Hors connexion</title>
<style>
  :root { color-scheme: light; --ink: #1c1b18; --muted: #6b675e; --sand: #f6f4ef; --primary: #1f6b4a; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--sand); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", Tahoma, sans-serif; }
  main { max-width: 26rem; padding: 24px 16px; text-align: center; display: flex; flex-direction: column; gap: 16px; align-items: center; }
  img { width: 64px; height: 64px; border-radius: 16px; }
  h1 { margin: 0; font-size: 1.5rem; }
  p { margin: 0; color: var(--muted); line-height: 1.5; }
  hr { width: 100%; border: 0; border-top: 1px solid #e4e0d6; }
  button { min-height: 44px; padding: 0 20px; border: 0; border-radius: 999px; background: var(--primary); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="Liinky">
  <h1>Pas de connexion</h1>
  <p>Les menus déjà ouverts sur ce téléphone restent disponibles. Les changements faits hors ligne seront envoyés dès le retour du réseau.</p>
  <hr>
  <h1 lang="ar" dir="rtl">لا يوجد اتصال</h1>
  <p lang="ar" dir="rtl">تبقى القوائم التي فتحتها على هذا الهاتف متاحة. تُرسل التعديلات التي تُجرى دون اتصال عند عودة الشبكة.</p>
  <button type="button" onclick="location.reload()">Réessayer · إعادة المحاولة</button>
</main>
<script>addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
